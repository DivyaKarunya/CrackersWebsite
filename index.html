<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Order Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 20px;
            color: #333;
        }
        .order-container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .customer-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        input[type="number"] {
            width: 60px;
            padding: 5px;
        }
        .total-row {
            font-weight: bold;
            background-color: #f9f9f9;
        }
        .total-row td {
            text-align: right;
        }
        .submit-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        .submit-btn:hover {
            background-color: #218838;
        }
          /* Image Lightbox Modal Styles */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            cursor: zoom-out;
        }
        .image-modal.show {
            display: flex;
            opacity: 1;
        }
        .modal-content {
            max-width: 80%;
            max-height: 80%;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        .image-modal.show .modal-content {
            transform: scale(1);
        }
        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="order-container">
    <h2>Product Order Form</h2>
    <form action="/submit-order" method="POST">
        
        <!-- Customer Details -->
        <div class="customer-info">
            <div class="form-group">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required autocomplete="name">
            </div>
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required autocomplete="tel">
            </div>
            <div class="form-group">
                <label for="address">Shipping Address:</label>
                <input type="text" id="address" name="address" required autocomplete="street-address">
            </div>
        </div>

        <!-- Product Table -->
        <table>
            <thead>
                <tr>
                     <th>Image</th>
                    <th>Product Item</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                </tr>
            </thead>
            <tbody>
                <tr class="product-row">
                    <td>
                        <img src="https://placeholder.com" alt="Wireless Mouse" class="product-img">
                    </td>
                    <td>Wireless Mouse</td>
                    <td>Ergonomic optical mouse</td>
                    <td class="price" data-value="20.00">20.00</td>
                    <td>
                        <input type="number" class="qty-input" name="qty_mouse" min="0" value="0">
                    </td>
                    <td class="subtotal">0.00</td>
                </tr>
                <tr class="product-row">
                    <td>
                        <img src="https://placeholder.com" alt="Mechanical Keyboard" class="product-img">
                    </td>
                    <td>Mechanical Keyboard</td>
                    <td>RGB backlit mechanical keyboard</td>
                    <td class="price" data-value="65.00">65.00</td>
                    <td>
                        <input type="number" class="qty-input" name="qty_keyboard" min="0" value="0">
                    </td>
                    <td class="subtotal">0.00</td>
                </tr>
                <tr class="product-row">
                     <td>
                        <img src="https://placeholder.com" alt="HD Monitor 24\"" class="product-img">
                    </td>
                    <td>HD Monitor 24"</td>
                    <td>1080p LED display</td>
                    <td class="price" data-value="150.00">150.00</td>
                    <td>
                        <input type="number" class="qty-input" name="qty_monitor" min="0" value="0">
                    </td>
                    <td class="subtotal">0.00</td>
                </tr>
                
                <!-- Totals Section -->
                <tr class="total-row">
                    <td colspan="5">Subtotal:</td>
                    <td id="cart-subtotal">0.00</td>
                </tr>
                <tr class="total-row">
                    <td colspan="5">Tax (10%):</td>
                    <td id="cart-tax">0.00</td>
                </tr>
                <tr class="total-row" style="font-size: 1.1em; color: #007bff;">
                    <td colspan="5">Total:</td>
                    <td id="cart-total">0.00</td>
                </tr>
            </tbody>
        </table>

        <!-- Additional Notes -->
        <div class="form-group" style="margin-bottom: 20px;">
            <label for="notes">Order Notes (Optional):</label>
            <textarea id="notes" name="notes" rows="3"></textarea>
        </div>

        <button type="submit" class="submit-btn">Place Order</button>
    </form>
</div>
<!-- Lightbox Modal Container -->
<div id="imageModal" class="image-modal">
    <span class="close-modal">&times;</span>
    <img class="modal-content" id="modalImg" alt="Enlarged view">
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const rows = document.querySelectorAll('.product-row');
        const cartSubtotalEl = document.getElementById('cart-subtotal');
        const cartTaxEl = document.getElementById('cart-tax');
        const cartTotalEl = document.getElementById('cart-total');
        const TAX_RATE = 0.10; // 10% tax rate


        // Modal Lightbox Setup
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const productImgs = document.querySelectorAll('.product-img');

        productImgs.forEach(img => {
            img.addEventListener('click', function() {
                modal.classList.add('show');
                modalImg.src = this.src;
            });
        });

        // Close modal setup
        modal.addEventListener('click', function() {
            modal.classList.remove('show');
        });

        function calculateTotals() {
            let orderSubtotal = 0;

            rows.forEach(row => {
                const price = parseFloat(row.querySelector('.price').getAttribute('data-value'));
                const qty = parseInt(row.querySelector('.qty-input').value) || 0;
                
                // Calculate item subtotal
                const itemSubtotal = price * qty;
                orderSubtotal += itemSubtotal;
                
                // Update item subtotal text
                row.querySelector('.subtotal').textContent = `${itemSubtotal.toFixed(2)}`;
            });

            // Calculate tax and total
            const taxAmount = orderSubtotal * TAX_RATE;
            const finalTotal = orderSubtotal + taxAmount;

            // Update main totals display
            cartSubtotalEl.textContent = `${orderSubtotal.toFixed(2)}`;
            cartTaxEl.textContent = `${taxAmount.toFixed(2)}`;
            cartTotalEl.textContent = `${finalTotal.toFixed(2)}`;
        }

        // Attach event listeners to all quantity boxes
        rows.forEach(row => {
            const input = row.querySelector('.qty-input');
            input.addEventListener('input', calculateTotals);
        });
    });
</script>

</body>
</html>
