<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Order Form</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --background: #f3f4f6;
            --surface: #ffffff;
            --text: #1f2937;
            --text-light: #4b5563;
            --border: #d1d5db;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--background); color: var(--text); padding: 2rem 1rem; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .form-container { background: var(--surface); padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 700px; }
        fieldset { border: none; margin-bottom: 2rem; }
        legend { font-size: 1.2rem; font-weight: 600; margin-bottom: 1rem; color: var(--primary-color); width: 100%; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-row { display: flex; gap: 1rem; }
        .form-row .form-group { flex: 1; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: 500; }
        .required::after { content: " *"; color: #ef4444; }
        input[type="text"], input[type="email"], input[type="tel"], select, textarea {
            width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; background-color: #fff;
        }
        .submit-btn { display: block; width: 100%; padding: 1rem; background-color: var(--primary-color); color: white; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: 600; cursor: pointer; }
        .submit-btn:hover { background-color: var(--primary-hover); }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Secure Order Form</h2>
    <p style="margin-bottom: 2rem; color: #4b5563; font-size: 0.95rem;">Please fill out the details below to complete your purchase.</p>
    <form action="/submit-order-endpoint" method="POST">
        <fieldset>
            <legend>1. Select Your Products</legend>
            <div class="form-group">
                <label for="product" class="required">Choose Item</label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>-- Select an option --</option>
                    <option value="premium-plan">Premium Package - $49.00</option>
                    <option value="standard-plan">Standard Package - $29.00</option>
                </select>
            </div>
        </fieldset>
        <fieldset>
            <legend>2. Customer Information</legend>
            <div class="form-row">
                <div class="form-group"><label class="required">First Name</label><input type="text" name="first_name" required></div>
                <div class="form-group"><label class="required">Last Name</label><input type="text" name="last_name" required></div>
            </div>
        </fieldset>
        <button type="submit" class="submit-btn">Place Order</button>
    </form>
</div>
</body>
</html>
