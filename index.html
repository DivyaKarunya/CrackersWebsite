<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Order Form</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
    .form-container { background: #fff; max-width: 500px; margin: 0 auto; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; background: #28a745; color: white; padding: 10px; border: none; margin-top: 15px; font-size: 16px; border-radius: 4px; cursor: pointer; }
    button:hover { background: #218838; }
    .total-section { margin-top: 15px; font-weight: bold; font-size: 18px; text-align: right; }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Order Form</h2>
    <form id="orderForm" onsubmit="handleOrder(event)">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" required placeholder="Enter your name">

      <label for="email">Email Address</label>
      <input type="email" id="email" required placeholder="you@example.com">

      <label for="product">Select Product</label>
      <select id="product" onchange="calculateTotal()">
        <option value="10">Notebook ($10)</option>
        <option value="25">Backpack ($25)</option>
        <option value="15">Water Bottle ($15)</option>
      </select>

      <label for="quantity">Quantity</label>
      <input type="number" id="quantity" min="1" value="1" onchange="calculateTotal()">

      <div class="total-section">
        Total: $<span id="totalPrice">10</span>
      </div>

      <button type="submit">Submit Order</button>
    </form>
  </div>

  <script>
    function calculateTotal() {
      const price = parseFloat(document.getElementById('product').value);
      const quantity = parseInt(document.getElementById('quantity').value) || 0;
      document.getElementById('totalPrice').innerText = (price * quantity).toFixed(2);
    }

    function handleOrder(e) {
      e.preventDefault();
      const name = document.getElementById('fullName').value;
      const total = document.getElementById('totalPrice').innerText;
      alert(`Thank you, ${name}! Your order totaling $${total} has been received.`);
    }
  </script>

</body>
</html>
