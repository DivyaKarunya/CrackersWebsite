<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Order Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 20px;
            color: #333;
        }
        .order-container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .customer-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        input[type="number"] {
            width: 60px;
            padding: 5px;
        }
        .submit-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        .submit-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="order-container">
    <h2>Product Order Form</h2>
    <form action="/submit-order" method="POST">
        
        <!-- Customer Details -->
        <div class="customer-info">
            <div class="form-group">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required autocomplete="name">
            </div>
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required autocomplete="tel">
            </div>
            <div class="form-group">
                <label for="address">Shipping Address:</label>
                <input type="text" id="address" name="address" required autocomplete="street-address">
            </div>
        </div>

        <!-- Product Table -->
        <table>
            <thead>
                <tr>
                    <th>Product Item</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Quantity</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Wireless Mouse</td>
                    <td>Ergonomic optical mouse</td>
                    <td>$20.00</td>
                    <td>
                        <input type="number" name="qty_mouse" min="0" value="0" onchange="calculateTotal()">
                    </td>
                </tr>
                <tr>
                    <td>Mechanical Keyboard</td>
                    <td>RGB backlit mechanical keyboard</td>
                    <td>$65.00</td>
                    <td>
                        <input type="number" name="qty_keyboard" min="0" value="0"onchange="calculateTotal()">
                    </td>
                </tr>
                <tr>
                    <td>HD Monitor 24"</td>
                    <td>1080p LED display</td>
                    <td>$150.00</td>
                    <td>
                        <input type="number" name="qty_monitor" min="0" value="0" onchange="calculateTotal()">
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="total-section">
        Total: $<span id="totalPrice">10</span>
      </div>

        <!-- Additional Notes -->
        <div class="form-group" style="margin-bottom: 20px;">
            <label for="notes">Order Notes (Optional):</label>
            <textarea id="notes" name="notes" rows="3"></textarea>
        </div>

        <button type="submit" class="submit-btn">Place Order</button>
    </form>
</div>
<script>
    function calculateTotal() {
      const price = parseFloat(document.getElementById('product').value);
      const quantity = parseInt(document.getElementById('quantity').value) || 0;
      document.getElementById('totalPrice').innerText = (price * quantity).toFixed(2);
    }

    function handleOrder(e) {
      e.preventDefault();
      const name = document.getElementById('fullName').value;
      const total = document.getElementById('totalPrice').innerText;
      alert(`Thank you, ${name}! Your order totaling $${total} has been received.`);
    }
  </script>
</body>
</html>
